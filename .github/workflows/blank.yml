name: Build ScreenCast TV APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: android-tv
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp android-tv/app/build/outputs/apk/release/app-release.apk ScreenCastTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ScreenCastTV-apk
          path: ScreenCastTV.apk
