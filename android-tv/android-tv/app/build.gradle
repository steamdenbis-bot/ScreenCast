plugins {
    id 'com.android.application'
}

android {
    namespace 'com.screencast.tv'
    compileSdk 34

    defaultConfig {
        applicationId 'com.screencast.tv'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '2.0'
    }

    // постоянный ключ подписи: без него каждая сборка на GitHub получает новый ключ,
    // и Android отказывается обновлять приложение поверх старого
    signingConfigs {
        fixed {
            storeFile file('screencast.keystore')
            storePassword 'screencast'
            keyAlias 'screencast'
            keyPassword 'screencast'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.fixed
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
